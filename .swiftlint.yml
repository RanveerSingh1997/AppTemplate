# .swiftlint.yml

included:
  - AppTemplate
  - AppTemplateTests

excluded:
  - build
  - .git
  - .github

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - force_unwrapping
  - sorted_imports
  - switch_case_alignment
  - vertical_parameter_alignment_on_call
  - vertical_parameter_alignment
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_optional_initialization
  - multiline_arguments

disabled_rules:
  - trailing_whitespace
  - todo

analyzer_rules:
  - unused_import
  - unused_declaration

file_length:
  warning: 500
  error: 1000

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  allowed_symbols: ["_"]
  excluded:
    - id
    - db
    - vm
    - ui
    - qa

# Enforced architecture rules (severity: error fails the SwiftLint build phase, so these
# are gates, not suggestions — see README's "Architecture rules" section for the reasoning
# behind each one). Add a new one here, not just to the README, when you find a pattern
# worth actually blocking rather than hoping code review catches it.
custom_rules:
  no_concrete_impl_outside_composition_root:
    included: ".*/Presentation/.*\\.swift"
    regex: '\b\w+(RepositoryImpl|ServiceImpl)\b'
    match_kinds: [identifier, typeidentifier]
    message: >
      Presentation code must depend on the protocol (e.g. `ItemRepository`), never a
      concrete `...Impl` type. Only AppDependencies (the composition root) may construct
      one — inject it through a ViewModel's initializer instead.
    severity: error

  no_new_singletons:
    included: ".*/(Domain|Data|Presentation)/.*\\.swift"
    regex: 'static\s+(let|var)\s+shared\s*='
    message: >
      Don't add a new singleton (`static let/var shared`). Add the dependency to
      AppDependencies and inject it through an initializer instead — see the README's
      "No singletons" rule.
    severity: error

reporter: xcode
