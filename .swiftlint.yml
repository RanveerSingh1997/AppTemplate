# .swiftlint.yml

included:
  - AppTemplate
  - AppTemplateTests

excluded:
  - build
  - .git
  - .github

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - force_unwrapping
  - sorted_imports
  - switch_case_alignment
  - vertical_parameter_alignment_on_call
  - vertical_parameter_alignment
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_optional_initialization
  - multiline_arguments

disabled_rules:
  - trailing_whitespace
  - todo

analyzer_rules:
  - unused_import
  - unused_declaration

file_length:
  warning: 500
  error: 1000

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  allowed_symbols: ["_"]
  excluded:
    - id
    - db
    - vm
    - ui
    - qa

reporter: xcode
